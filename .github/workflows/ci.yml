name: CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPO: astraluniverse/bank-app

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v2.1.0
        with:
          dockerfile: ./Dockerfile

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image tags
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Show image tags
        run: |
          {
            echo "Published image tags:"
            echo "${IMAGE_REPO}:latest"
            echo "${IMAGE_REPO}:${GITHUB_SHA}"
            echo "${IMAGE_REPO}:${SHORT_SHA}"
            echo
            echo "Use this tag for GitOps promotion:"
            echo "${SHORT_SHA}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false 
          tags: bank-app:ci-temp

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bank-app:ci-temp
          format: table
          ignore-unfixed: true

      - name: Run smoke test
        run: |
          docker run -d --name bank-app-smoke -p 5000:5000 bank-app:ci-temp
          trap 'docker logs bank-app-smoke || true; docker stop bank-app-smoke || true' EXIT

          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:5000/ > /tmp/bank-app-smoke.html; then
              grep -q "Login Page" /tmp/bank-app-smoke.html
              exit 0
            fi
            sleep 1
          done

          echo "Smoke test failed: app did not serve the login page" >&2
          exit 1

      - name: Push final image to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:latest
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:${{ env.SHORT_SHA }}
